name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建双击包并运行原生入口自检
        shell: pwsh
        run: ./build/Build-Windows.ps1
